# @package _global_
module:
  _target_: emg2qwerty.lightning.GRUCTCModule
  in_features: 528  # freq * channels = (n_fft // 2 + 1) * 16 (Kept identical)
  mlp_features: [384] # Kept identical so the spatial MLP outputs the right size
  
  # New GRU Hyperparameters (Replacing block_channels and kernel_width)
  rnn_hidden_size: 256
  rnn_num_layers: 2
  rnn_dropout: 0.3

datamodule:
  _target_: emg2qwerty.lightning.WindowedEMGDataModule
  window_length: 8000  # 4 sec windows for 2kHz EMG (Kept identical)
  padding: [1800, 200]  # 900ms past context, 100ms future context (Kept identical)